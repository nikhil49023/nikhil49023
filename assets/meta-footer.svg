<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" height="100%">
  <defs>
    <linearGradient id="footerHorizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0064E0" />
      <stop offset="30%" stop-color="#0866FF" />
      <stop offset="60%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <radialGradient id="footerGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0866FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0866FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Base Card Rect -->
  <rect x="2" y="2" width="1196" height="86" rx="14" fill="#070A12" stroke="#1E293B" stroke-width="1.2" />

  <!-- Ambient Glow -->
  <rect x="2" y="2" width="1196" height="86" rx="14" fill="url(#footerGlow)" pointer-events="none" />

  <!-- Precision Meta Horizon Line -->
  <line x1="40" y1="20" x2="1160" y2="20" stroke="url(#footerHorizon)" stroke-width="2" />
  <line x1="500" y1="20" x2="700" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />

  <!-- Footer Telemetry -->
  <g transform="translate(40, 52)">
    <circle cx="6" cy="6" r="3.5" fill="#00C2FF" />
    <text x="18" y="10" fill="#94A3B8" font-size="11" font-weight="600" class="mono">
      AUTONOMOUS SYSTEMS ARCHITECTURE <tspan fill="#38BDF8">//</tspan> META DESIGN SYSTEM <tspan fill="#38BDF8">//</tspan> REV 2026.4
    </text>

    <text x="1120" y="10" text-anchor="end" fill="#64748B" font-size="11" font-weight="500" class="mono">
      KERNEL: <tspan fill="#38BDF8">ACTIVE</tspan> · DISPATCH: <tspan fill="#00C2FF">DETERMINISTIC</tspan> · ALL CHECKS PASS
    </text>
  </g>
</svg>
