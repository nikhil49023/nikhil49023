<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Meta Signature Horizon Gradient -->
    <linearGradient id="metaHorizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0064E0" />
      <stop offset="25%" stop-color="#0866FF" />
      <stop offset="50%" stop-color="#00C2FF" />
      <stop offset="75%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Text Header Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#0866FF" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#00C2FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="blueGlow" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0866FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0866FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Vector Horizon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="metaGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
      <circle cx="40" cy="0" r="1" fill="#00C2FF" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.96); }
    }
    
    @keyframes sweep {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-dot {
      animation: pulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Base Card Rect with Border -->
  <rect x="2" y="2" width="1196" height="376" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Grid Background Pattern -->
  <rect x="2" y="2" width="1196" height="376" rx="18" fill="url(#metaGrid)" />

  <!-- Ambient Glow Overlays -->
  <rect x="2" y="2" width="1196" height="376" rx="18" fill="url(#blueGlow)" pointer-events="none" />
  <rect x="2" y="2" width="1196" height="376" rx="18" fill="url(#cyanGlow)" pointer-events="none" />
  <rect x="2" y="2" width="1196" height="376" rx="18" fill="url(#indigoGlow)" pointer-events="none" />

  <!-- Top System Telemetry Bar -->
  <g transform="translate(40, 42)">
    <!-- Status Indicator Pill -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#0D1527" stroke="#1E293B" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#00F0FF" class="pulsing-dot" />
    <circle cx="14" cy="13" r="7" fill="none" stroke="#00C2FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="28" y="17" fill="#38BDF8" font-size="11" font-weight="600" class="mono" letter-spacing="0.5">KERNEL: NOMINAL</text>

    <!-- Meta Telemetry Specs -->
    <text x="200" y="17" fill="#64748B" font-size="11" font-weight="500" class="mono">
      SYS_ID: <tspan fill="#94A3B8">NX-49023</tspan> // ARCH: <tspan fill="#94A3B8">PHYSICAL_AI.X86_ARM</tspan> // PROTOCOL: <tspan fill="#94A3B8">FAST_MCP</tspan>
    </text>

    <!-- Right Alignment Telemetry -->
    <text x="1120" y="17" text-anchor="end" fill="#64748B" font-size="11" font-weight="500" class="mono">
      FREQ: <tspan fill="#00C2FF">50Hz DETERMINISTIC</tspan> // LATENCY: <tspan fill="#38BDF8">&lt;2ms</tspan>
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#1E293B" stroke-width="1" stroke-opacity="0.8" />

  <!-- Main Hero Content -->
  <g transform="translate(40, 140)">
    <!-- Tagline pill -->
    <rect x="0" y="-32" width="270" height="22" rx="11" fill="#0A1832" stroke="#0866FF" stroke-opacity="0.5" stroke-width="1" />
    <text x="12" y="-17" fill="#60A5FA" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">META DESIGN SYSTEM // RUNTIME</text>

    <!-- Main Name / Identity -->
    <text x="0" y="24" fill="url(#titleGrad)" font-size="44" font-weight="800" class="sans" letter-spacing="-0.5">
      Kilani Sai Nikhil
    </text>

    <!-- Focus Area Pillars -->
    <text x="0" y="58" fill="#94A3B8" font-size="16" font-weight="500" class="sans">
      Systems &amp; Robotics Engineer <tspan fill="#00C2FF" font-weight="700">·</tspan> Physical AI &amp; Simulation <tspan fill="#00C2FF" font-weight="700">·</tspan> Multi-Agent Architectures
    </text>

    <!-- Engineering Mission -->
    <text x="0" y="86" fill="#64748B" font-size="13" font-weight="400" class="sans">
      Architecting high-autonomy physical systems, deterministic drone swarms, and sovereign multi-agent cognitive platforms.
    </text>
  </g>

  <!-- Precision Meta Horizon Curve (Signature Horizon Wave) -->
  <path d="M 40 270 Q 320 220 600 255 T 1160 235" fill="none" stroke="url(#metaHorizon)" stroke-width="2.5" filter="url(#neonGlow)" />
  <path d="M 40 270 Q 320 220 600 255 T 1160 235" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 6" />

  <!-- Bottom Metric Pods (4 Modules) -->
  <g transform="translate(40, 290)">
    <!-- Pod 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="265" height="58" rx="10" fill="#0B101E" stroke="#1E293B" stroke-width="1" />
      <rect x="12" y="10" width="4" height="38" rx="2" fill="#0866FF" />
      <text x="26" y="24" fill="#38BDF8" font-size="10" font-weight="700" class="mono" letter-spacing="0.5">01 / PHYSICAL AI &amp; UAV</text>
      <text x="26" y="44" fill="#F1F5F9" font-size="12" font-weight="600" class="sans">PX4 SITL · ROS 2 · 50Hz Offboard</text>
    </g>

    <!-- Pod 2 -->
    <g transform="translate(285, 0)">
      <rect x="0" y="0" width="265" height="58" rx="10" fill="#0B101E" stroke="#1E293B" stroke-width="1" />
      <rect x="12" y="10" width="4" height="38" rx="2" fill="#00C2FF" />
      <text x="26" y="24" fill="#00C2FF" font-size="10" font-weight="700" class="mono" letter-spacing="0.5">02 / COGNITIVE RUNTIMES</text>
      <text x="26" y="44" fill="#F1F5F9" font-size="12" font-weight="600" class="sans">FastMCP · Multi-Agent Swarms</text>
    </g>

    <!-- Pod 3 -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="265" height="58" rx="10" fill="#0B101E" stroke="#1E293B" stroke-width="1" />
      <rect x="12" y="10" width="4" height="38" rx="2" fill="#6366F1" />
      <text x="26" y="24" fill="#818CF8" font-size="10" font-weight="700" class="mono" letter-spacing="0.5">03 / REAL-TIME ACCELERATION</text>
      <text x="26" y="44" fill="#F1F5F9" font-size="12" font-weight="600" class="sans">CUDA C++ · PyTorch · Jetson Edge</text>
    </g>

    <!-- Pod 4 -->
    <g transform="translate(855, 0)">
      <rect x="0" y="0" width="265" height="58" rx="10" fill="#0B101E" stroke="#1E293B" stroke-width="1" />
      <rect x="12" y="10" width="4" height="38" rx="2" fill="#38BDF8" />
      <text x="26" y="24" fill="#38BDF8" font-size="10" font-weight="700" class="mono" letter-spacing="0.5">04 / DISTRIBUTED INFRA</text>
      <text x="26" y="44" fill="#F1F5F9" font-size="12" font-weight="600" class="sans">Real PTY · Docker · MicroXRCE</text>
    </g>
  </g>
</svg>
