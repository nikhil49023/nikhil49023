<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="metricCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0A0F1E" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <linearGradient id="metricBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#0866FF" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#00C2FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="statNumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <pattern id="statGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .stat-label { font-size: 10px; font-weight: 700; fill: #64748B; letter-spacing: 1px; }
    .stat-sub { font-size: 11px; font-weight: 500; fill: #94A3B8; }
    .stat-val { font-size: 34px; font-weight: 800; fill: url(#statNumGrad); letter-spacing: -0.5px; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#metricCardBg)" stroke="url(#metricBorder)" stroke-width="1.2" />
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#statGrid)" />

  <!-- Card Top Header -->
  <g transform="translate(36, 28)">
    <circle cx="6" cy="6" r="4" fill="#00C2FF" />
    <text x="18" y="10" fill="#38BDF8" font-size="11" font-weight="700" class="mono" letter-spacing="1">TELEMETRY &amp; ENGINEERING ACTIVITY // LIVE REPOSITORY INSIGHTS</text>
    <text x="1128" y="10" text-anchor="end" fill="#64748B" font-size="11" font-weight="500" class="mono">VERIFIED COMMIT ARCHIVE</text>
  </g>

  <!-- 4 Stat Metric Blocks -->
  <g transform="translate(36, 68)">
    <!-- Block 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="265" height="96" rx="10" fill="#0D1424" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" class="mono stat-label">TOTAL CONTRIBUTIONS</text>
      <text x="20" y="62" class="sans stat-val">1,319<tspan font-size="20" fill="#00C2FF">+</tspan></text>
      <text x="20" y="82" class="sans stat-sub">Verified Code &amp; Review Events</text>
    </g>

    <!-- Block 2 -->
    <g transform="translate(285, 0)">
      <rect x="0" y="0" width="265" height="96" rx="10" fill="#0D1424" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" class="mono stat-label">PRODUCTION COMMITS</text>
      <text x="20" y="62" class="sans stat-val">990<tspan font-size="20" fill="#0866FF">+</tspan></text>
      <text x="20" y="82" class="sans stat-sub">System Implementations</text>
    </g>

    <!-- Block 3 -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="265" height="96" rx="10" fill="#0D1424" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" class="mono stat-label">REPOSITORIES &amp; LABS</text>
      <text x="20" y="62" class="sans stat-val">35<tspan font-size="20" fill="#6366F1"> R&amp;D</tspan></text>
      <text x="20" y="82" class="sans stat-sub">16 Public Architectures</text>
    </g>

    <!-- Block 4 -->
    <g transform="translate(855, 0)">
      <rect x="0" y="0" width="265" height="96" rx="10" fill="#0D1424" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" class="mono stat-label">OFFBOARD FLIGHT CONTROL</text>
      <text x="20" y="62" class="sans stat-val">50<tspan font-size="20" fill="#00C2FF"> Hz</tspan></text>
      <text x="20" y="82" class="sans stat-sub">Deterministic SITL Frequency</text>
    </g>
  </g>

  <!-- Horizontal Engineering Domain Stack Breakdown Bar -->
  <g transform="translate(36, 184)">
    <!-- Label -->
    <text x="0" y="10" fill="#64748B" font-size="10" font-weight="600" class="mono">SYSTEM CAPACITY ALLOCATION:</text>

    <!-- Progress bar track -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="938" height="10" rx="5" fill="#111827" />
      <!-- Segment 1: Robotics 40% (375px) -->
      <rect x="0" y="0" width="375" height="10" rx="5" fill="#0866FF" />
      <!-- Segment 2: Multi-Agent 30% (281px) -->
      <rect x="378" y="0" width="281" height="10" fill="#00C2FF" />
      <!-- Segment 3: Real-Time / CUDA 20% (187px) -->
      <rect x="662" y="0" width="187" height="10" fill="#6366F1" />
      <!-- Segment 4: Systems / Infra 10% (94px) -->
      <rect x="852" y="0" width="86" height="10" rx="5" fill="#38BDF8" />
    </g>

    <!-- Legend -->
    <g transform="translate(190, 28)">
      <circle cx="4" cy="4" r="3.5" fill="#0866FF" />
      <text x="14" y="8" fill="#94A3B8" font-size="10.5" font-weight="500" class="sans">Robotics &amp; Physical AI (40%)</text>

      <circle cx="230" cy="4" r="3.5" fill="#00C2FF" />
      <text x="240" y="8" fill="#94A3B8" font-size="10.5" font-weight="500" class="sans">Cognitive &amp; Multi-Agent (30%)</text>

      <circle cx="460" cy="4" r="3.5" fill="#6366F1" />
      <text x="470" y="8" fill="#94A3B8" font-size="10.5" font-weight="500" class="sans">CUDA &amp; Acceleration (20%)</text>

      <circle cx="670" cy="4" r="3.5" fill="#38BDF8" />
      <text x="680" y="8" fill="#94A3B8" font-size="10.5" font-weight="500" class="sans">Systems &amp; Infra (10%)</text>
    </g>
  </g>
</svg>
